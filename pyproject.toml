[project]
name = "ad-retrieval-ranking"
version = "0.1.0"
description = "Ad retrieval, ranking and ingestion pipeline (Python ingestion + Go serving)"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]
